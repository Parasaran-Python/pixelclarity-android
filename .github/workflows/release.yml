name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK for Release
        run: ./gradlew assembleDebug --stacktrace

      - name: Set up Python for 16 KB Page Size Verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify 16 KB Page Size Alignment
        run: python3 scripts/verify_16kb_page_size.py app/build/outputs/apk/debug/*.apk

      - name: Rename APK for Release
        run: |
          VERSION="${{ github.event.inputs.version_name || github.ref_name }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/PixelClarity-${VERSION}.apk"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
