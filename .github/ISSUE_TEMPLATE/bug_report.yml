name: 🐛 Bug Report
description: File a bug report to help improve PixelClarity
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: device-info
    attributes:
      label: Device & Android OS Version
      description: What Android device and OS version are you using? (e.g. Pixel 8 Pro, Android 15)
      placeholder: e.g., Google Pixel 8, Android 14
    validations:
      required: true
  - type: dropdown
    id: hardware-delegate
    attributes:
      label: Hardware Acceleration Delegate
      description: Which execution delegate was selected?
      options:
        - Auto (NPU / GPU with CPU fallback)
        - Dedicated NPU / NNAPI
        - CPU Multi-threaded
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open app
        2. Select image ...
        3. Tap Upscale Image
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
